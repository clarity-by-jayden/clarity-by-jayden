function wrap(str,width,font){ctx.font=font;let out=[],line='';for(const word of str.trim().split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>width&&line){out.push(line);line=word}else line=next}if(line)out.push(line);return out}

for(const id of ['layout','format','headline','highlight','sub','accent','headlineSize','subSize','paintStrength'])$(id).addEventListener('input',()=>{for(const [slider,label] of [['headlineSize','headlineSizeValue'],['subSize','subSizeValue'],['paintStrength','paintValue']])$(label).textContent=$(slider).value;draw()});
$('shuffle').onclick=()=>{shuffleSeed++;draw()};
$('art').addEventListener('change',e=>{const f=e.target.files[0];if(!f){art=null;draw();return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{art=im;URL.revokeObjectURL(u);draw()};im.src=u});
$('reset').onclick=()=>{Object.entries({layout:'callout',format:'1080',headline:'Paint with confidence',highlight:'confidence',sub:'Discover the joy of watercolour painting.',accent:'pink',headlineSize:'90',subSize:'32',paintStrength:'85'}).forEach(([k,v])=>$(k).value=v);$('art').value='';art=null;shuffleSeed=0;$('headlineSizeValue').textContent='90';$('subSizeValue').textContent='32';$('paintValue').textContent='85';draw()};
$('save').onclick=()=>{try{draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='painting-with-nicola-'+$('layout').value+'.png';a.click();$('status').textContent='PNG export started.'}catch(e){$('status').textContent='Export failed: '+e.message}};
draw();</script></html>
