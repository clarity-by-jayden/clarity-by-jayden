<style>
:root{--ink:#2d1945;--purple:#8255bd;--lilac:#eee5fa;--lime:#b9ff25;--cream:#faf7f2;--pink:#f2c8eb;--shadow:5px 5px 0 var(--ink)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--lilac);background-image:radial-gradient(#8255bd22 1px,transparent 1px);background-size:18px 18px;font-family:Arial,sans-serif;color:var(--ink)}
.wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:24px}
.logo{align-self:center;font:700 34px Georgia,serif;letter-spacing:-2px;color:var(--ink);text-decoration:none}
.logo span{color:var(--lime)}
.window{border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--cream)}
.window-bar{min-height:38px;padding:7px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--purple);border-bottom:3px solid var(--ink);font:800 11px/1 Arial;letter-spacing:.08em;color:#fff;text-transform:uppercase;user-select:none}
.window-bar>b{text-align:right;font-size:20px}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;background:var(--lime);display:block}
.dots i:nth-child(2){background:var(--pink)}
.dots i:nth-child(3){background:var(--cream)}
.content{padding:clamp(28px,5vw,50px)}
.tag{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);margin:0 0 18px}
h1{font-size:clamp(32px,5.5vw,50px);line-height:1;letter-spacing:-.04em;margin:0 0 18px}
h1 em{font-family:Georgia,serif;font-weight:400;color:var(--purple)}
p{font-size:16px;line-height:1.6;color:#665576;max-width:460px;margin:0 0 4px}

/* countdown */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 6px}
.count-card{background:var(--lime);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:14px 6px;text-align:center}
.count-card b{display:block;font:900 clamp(24px,5vw,34px)/1 Georgia,serif;font-variant-numeric:tabular-nums}
.count-card span{display:block;margin-top:4px;font:800 10px Arial;letter-spacing:.1em;text-transform:uppercase;color:#4a3a63}
.count-target{margin-top:14px;font-size:12px;font-weight:800;color:var(--purple)}
.live-banner{display:none;margin-top:16px;background:var(--lime);border:2px solid var(--ink);border-radius:8px;padding:14px 16px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}

/* notify embed */
.notify{padding:clamp(20px,4vw,28px)}

@media(max-width:480px){.countdown{gap:8px}.count-card{padding:10px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="#">Clarity<span>.</span></a>
  <main class="window">
    <div class="window-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <span>clarity_by_jayden.exe</span>
      <b>×</b>
    </div>
    <div class="content">
      <p class="tag">Almost there</p>
      <h1>The new site launches Monday. <em>9am sharp.</em></h1>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="count-card"><b id="days">00</b><span>Days</span></div>
        <div class="count-card"><b id="hours">00</b><span>Hours</span></div>
        <div class="count-card"><b id="mins">00</b><span>Mins</span></div>
        <div class="count-card"><b id="secs">00</b><span>Secs</span></div>
      </div>
      <p class="count-target" id="targetLabel"></p>
      <div class="live-banner" id="liveBanner">We're live — go take a look! ↗</div>
    </div>
  </main>

  <section class="window">
    <div class="window-bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <span>notify_me</span>
      <b>×</b>
    </div>
    <div class="notify">
      <iframe data-tally-src="https://tally.so/embed/7RYyOL?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="501" frameborder="0" marginheight="0" marginwidth="0" title="Want a nudge when it's live?"></iframe>
    </div>
  </section>
</div>

<script>
/* Countdown to the next Monday 9am, in the visitor's local time */
function getNextMonday9am(){
  const now = new Date();
  const target = new Date(now);
  target.setHours(9,0,0,0);
  const day = target.getDay(); // 0=Sun..6=Sat, Monday=1
  let diffDays = (1 - day + 7) % 7;
  if(diffDays === 0 && target <= now) diffDays = 7;
  target.setDate(target.getDate() + diffDays);
  return target;
}

const target = getNextMonday9am();
document.getElementById('targetLabel').textContent =
  'Counting down to ' + target.toLocaleString(undefined, { weekday:'long', hour:'numeric', minute:'2-digit' }) + ' your time';

const daysEl = document.getElementById('days');
const hoursEl = document.getElementById('hours');
const minsEl = document.getElementById('mins');
const secsEl = document.getElementById('secs');
const countdownEl = document.getElementById('countdown');
const liveBanner = document.getElementById('liveBanner');
const pad = (n) => String(n).padStart(2,'0');

function tick(){
  const diff = target - new Date();
  if(diff <= 0){
    countdownEl.style.display = 'none';
    document.getElementById('targetLabel').style.display = 'none';
    liveBanner.style.display = 'block';
    clearInterval(timer);
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor(diff % 86400000 / 3600000);
  const m = Math.floor(diff % 3600000 / 60000);
  const s = Math.floor(diff % 60000 / 1000);
  daysEl.textContent = pad(d);
  hoursEl.textContent = pad(h);
  minsEl.textContent = pad(m);
  secsEl.textContent = pad(s);
}
tick();
const timer = setInterval(tick, 1000);
</script>

<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}
</script>
</body>
</html>
