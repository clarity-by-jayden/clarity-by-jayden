<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Clarity by Jayden</title>
  <meta name="description" content="That page couldn't be found. Head back to Clarity by Jayden.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://claritybyjayden.online/404.html">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root{--ink:#2d1945;--purple:#8255bd;--lilac:#eee5fa;--lime:#b9ff25;--cream:#faf7f2;--pink:#f2c8eb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--lilac);background-image:radial-gradient(#8255bd22 1px,transparent 1px);background-size:18px 18px;font-family:Arial,sans-serif;color:var(--ink)}
    .window{width:min(680px,100%);border:3px solid var(--ink);border-radius:12px;background:var(--cream);overflow:hidden;box-shadow:7px 7px 0 var(--ink)}
    .bar{min-height:40px;padding:8px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--purple);border-bottom:3px solid var(--ink);color:white;font:800 11px Arial;letter-spacing:.1em;text-transform:uppercase}
    .dots{display:flex;gap:5px}.dots i{width:11px;height:11px;border:2px solid var(--ink);border-radius:50%;background:var(--lime)}.dots i:nth-child(2){background:var(--pink)}.dots i:nth-child(3){background:var(--cream)}
    .bar b{text-align:right;font-size:20px}
    .content{padding:48px}
    .tag{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--purple)}
    h1{font:700 clamp(44px,8vw,76px)/.95 Georgia,serif;letter-spacing:-.045em;margin:18px 0 20px}
    h1 em{font-weight:400;color:var(--purple)}
    p{font-size:17px;line-height:1.6;color:#665576;max-width:520px}
    a{display:inline-block;margin-top:10px;background:var(--lime);color:var(--ink);text-decoration:none;font-weight:900;border:3px solid var(--ink);border-radius:7px;padding:14px 18px;box-shadow:4px 4px 0 var(--ink)}
    @media(max-width:560px){.content{padding:34px 24px}}
  </style>
</head>
<body>
  <main class="window">
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div><span>clarity_not_found.exe</span><b>×</b></div>
    <div class="content">
      <div class="tag">404 / PAGE NOT FOUND</div>
      <h1>Looks like this bit needs <em>untangling.</em></h1>
      <p>The page you were looking for isn't here. Head back to Clarity and carry on from there.</p>
      <a href="/">Back to Clarity →</a>
    </div>
  </main>
</body>
</html>
