<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Client Portal | Clarity by Jayden</title>

  <style>
    :root {
      --ink:#2d1945;
      --purple:#8255bd;
      --lilac:#eee5fa;
      --lime:#b9ff25;
      --cream:#faf7f2;
      --white:#fff;
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      min-height:100%;
    }

    body {
      font-family:Arial, Helvetica, sans-serif;
      background:var(--cream);
      color:var(--ink);
    }

    button, input {
      font:inherit;
    }

    .topbar {
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:18px 5vw;
      background:var(--cream);
      border-bottom:1px solid rgba(45,25,69,.12);
    }

    .logo {
      font:34px Georgia, serif;
      letter-spacing:-2px;
      color:var(--ink);
      text-decoration:none;
    }

    .logo span {
      color:var(--lime);
    }

    .client-label {
      font-size:12px;
      font-weight:800;
      letter-spacing:.15em;
      text-transform:uppercase;
      color:var(--purple);
      text-align:center;
    }

    .login-view {
      min-height:calc(100vh - 76px);
      display:grid;
      place-items:center;
      padding:50px 20px;
      background:
        radial-gradient(circle at 15% 15%, rgba(185,255,37,.28), transparent 26%),
        linear-gradient(135deg, var(--lilac), var(--cream));
    }

    .login-card {
      width:min(520px, 100%);
      background:var(--white);
      padding:48px;
      border:1px solid rgba(45,25,69,.12);
      box-shadow:0 28px 70px rgba(45,25,69,.16);
    }

    .eyebrow {
      margin:0 0 18px;
      color:var(--purple);
      font-size:12px;
      font-weight:800;
      letter-spacing:.17em;
      text-transform:uppercase;
    }

    h1 {
      margin:0;
      font-size:clamp(42px, 7vw, 66px);
      line-height:.95;
      letter-spacing:-.05em;
    }

    h1 em {
      color:var(--purple);
      font-family:Georgia, serif;
      font-weight:400;
    }

    .intro {
      margin:24px 0 30px;
      line-height:1.65;
      color:#665576;
    }

    label {
      display:block;
      margin-bottom:9px;
      font-size:13px;
      font-weight:800;
    }

    .password-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
    }

    input {
      width:100%;
      min-width:0;
      padding:15px 16px;
      border:1px solid #c9b9d9;
      border-radius:4px;
      background:white;
      color:var(--ink);
      outline:none;
    }

    input:focus {
      border-color:var(--purple);
      box-shadow:0 0 0 3px rgba(130,85,189,.13);
    }

    .submit {
      border:0;
      border-radius:4px;
      padding:15px 20px;
      background:var(--ink);
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .submit:hover {
      background:var(--purple);
    }

    .error {
      min-height:22px;
      margin:12px 0 0;
      color:#9d2147;
      font-size:13px;
      font-weight:700;
    }

    .notice {
      margin-top:28px;
      padding-top:20px;
      border-top:1px solid #e4daed;
      color:#7a6988;
      font-size:12px;
      line-height:1.55;
    }

    .portal-view {
      display:none;
      height:calc(100vh - 76px);
      background:white;
    }

    .portal-view.active {
      display:block;
    }

    iframe {
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:white;
    }

    .logout {
      display:none;
      border:1px solid var(--ink);
      border-radius:100px;
      padding:10px 15px;
      background:transparent;
      color:var(--ink);
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }

    .logout.visible {
      display:inline-flex;
    }

    @media (max-width:600px) {
      .topbar { min-height:68px; }
      .logo { font-size:28px; }
      .client-label { display:none; }
      .login-view { min-height:calc(100vh - 68px); }
      .login-card { padding:34px 24px; }
      .password-row { grid-template-columns:1fr; }
      .portal-view { height:calc(100vh - 68px); }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="logo" href="../../index.html" aria-label="Clarity by Jayden home">
      Clarity<span>.</span>
    </a>

    <span class="client-label" id="clientHeader"></span>

    <button class="logout" id="logoutButton" type="button">
      Sign out
    </button>
  </header>

  <main>
    <section class="login-view" id="loginView">
      <div class="login-card">
        <p class="eyebrow">Private client portal</p>

        <h1>
          Welcome,<br>
          <em id="clientWelcome"></em>
        </h1>

        <p class="intro">
          Enter your client password to view your Clarity workspace.
        </p>

        <form id="loginForm">
          <label for="password">Portal password</label>

          <div class="password-row">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="errorMessage"
            >

            <button class="submit" type="submit">
              Enter portal →
            </button>
          </div>

          <p class="error" id="errorMessage" role="alert"></p>
        </form>

        <p class="notice">
          This page uses a simple browser-based password and is intended
          for ordinary project information, not highly sensitive data.
        </p>
      </div>
    </section>

    <section class="portal-view" id="portalView">
      <iframe
        id="portalFrame"
        loading="lazy"
        allowfullscreen
      ></iframe>
    </section>
  </main>

  <script>
    /* ==========================================================
       ONLY EDIT THESE THREE LINES FOR EACH CLIENT
       ========================================================== */

    const CLIENT_NAME = "Diane Darling";

    const CLIENT_PASSWORD = "Dian3d4rling$";

    const NOTION_EMBED_URL = "<iframe src="https://jaydencooke.notion.site/ebd//fed75161e86640989df113995f4b3cd9" width="100%" height="600" frameborder="0" allowfullscreen />";

    /* ==========================================================
       DO NOT EDIT ANYTHING BELOW THIS LINE
       ========================================================== */

    const clientHeader = document.getElementById("clientHeader");
    const clientWelcome = document.getElementById("clientWelcome");
    const loginView = document.getElementById("loginView");
    const portalView = document.getElementById("portalView");
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");
    const portalFrame = document.getElementById("portalFrame");
    const logoutButton = document.getElementById("logoutButton");

    const clientSlug = CLIENT_NAME
      .toLowerCase()
      .trim()
      .replace(/&/g, "and")
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "");

    const SESSION_KEY = "clarity_" + clientSlug + "_access";

    document.title = CLIENT_NAME + " Client Portal | Clarity by Jayden";
    clientHeader.textContent = CLIENT_NAME + " Client Portal";
    clientWelcome.textContent = CLIENT_NAME + ".";
    portalFrame.title = CLIENT_NAME + " Clarity Portal";
    portalView.setAttribute("aria-label", CLIENT_NAME + " Notion portal");

    function showPortal() {
      sessionStorage.setItem(SESSION_KEY, "granted");
      loginView.style.display = "none";
      portalView.classList.add("active");
      logoutButton.classList.add("visible");

      if (!portalFrame.src) {
        portalFrame.src = NOTION_EMBED_URL;
      }
    }

    function showLogin() {
      sessionStorage.removeItem(SESSION_KEY);
      portalView.classList.remove("active");
      loginView.style.display = "grid";
      logoutButton.classList.remove("visible");
      portalFrame.removeAttribute("src");
      passwordInput.value = "";
      passwordInput.focus();
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();
      errorMessage.textContent = "";

      if (passwordInput.value === CLIENT_PASSWORD) {
        showPortal();
      } else {
        errorMessage.textContent =
          "That password is not correct. Please try again.";
        passwordInput.select();
      }
    });

    logoutButton.addEventListener("click", showLogin);

    if (sessionStorage.getItem(SESSION_KEY) === "granted") {
      showPortal();
    }
  </script>
</body>
</html>
